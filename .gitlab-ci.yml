# ==============================================================================
# 標準 CI/CD（全專案同一套）
#
#   check  : GitLab shared runner，跑 typecheck + build。所有 branch / MR 都跑。
#   deploy : docker-host（10.11.12.55）上 tag=dockerhost 的 shell runner，
#            只在預設分支（main）跑。
#            GIT_STRATEGY: none —— runner 不 clone，直接在部署目錄操作 git，
#            部署目錄本身就是唯一事實來源。
#
# 認證：deploy 用 CI_JOB_TOKEN 對 GitLab 取用，token 只在該 job 存活期間有效。
#      主機上不需要、也刻意不放任何長期憑證；fetch 用完整 URL 帶 token，
#      不寫回 .git/config，所以部署目錄不會殘留任何 secret。
#
# 前提（由 docker-host 上 ops/deploy-perms.sh 一次設定，全專案共用）：
#   部署目錄 owner=gitlab-runner、group=deploy、目錄 setgid、.env 640。
#
# 2026-08-08 從 rsync 流程改為 git 流程。舊流程的問題：
#   rsync 會把 runner build dir 的 .git（含暫時性 .gitlab-runner.ext.conf 的
#   include 設定）一起同步進部署目錄，導致部署目錄變成 detached HEAD，
#   而且 interagent 在該目錄跑任何 git 都會 Permission denied。
#   舊流程原本繞過 git 的理由（dubious ownership）已由權限根治解決。
# ==============================================================================

stages:
  - check
  - deploy

default:
  image: node:22

check-client:
  stage: check
  tags:
    - pve-note-check
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - client/node_modules/
  script:
    - cd client
    - npm ci
    - npm run typecheck
    - npm test
    - npm run build

check-server:
  stage: check
  tags:
    - pve-note-check
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - server/node_modules/
  script:
    - cd server
    - npm ci
    - npm run typecheck
    - npm test
    - npm run build

deploy:
  stage: deploy
  tags:
    - dockerhost
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
    url: http://10.11.12.55:8790
  variables:
    GIT_STRATEGY: none
    DEPLOY_DIR: /home/interagent/note
    HEALTH_URL: http://localhost:8790/
    SKYNET_MAINTENANCE_URL: http://10.11.12.55:3001/api/maintenance
    # note 部署會影響兩個監控目標：72 = 服務存活、94 = 頁面預覽語意探測。
    # 只掛 72 的話，94 會在部署期間誤報。維護 API 的 targetIds 陣列參數目前是
    # 死的（zod 有定義但 handler 沒讀），所以這裡逐一呼叫。
    SKYNET_TARGET_IDS: "72 94"
    SKYNET_MAINTENANCE_MINUTES: "30"
  script:
    - |
      set -euo pipefail

      auth_args=()
      if [ -n "${SKYNET_API_KEY:-}" ]; then
        auth_args=(-H "X-API-Key: ${SKYNET_API_KEY}")
      fi
      maintenance_ids=""

      for target_id in $SKYNET_TARGET_IDS; do
        payload="{\"scope\":\"target\",\"targetId\":${target_id},\"durationMinutes\":${SKYNET_MAINTENANCE_MINUTES},\"reason\":\"deploy note ${CI_COMMIT_SHORT_SHA:-unknown}\"}"

        post_response="$(
          curl -sS --connect-timeout 3 --max-time 10 -w '\n%{http_code}' \
            -X POST "$SKYNET_MAINTENANCE_URL" \
            -H "Content-Type: application/json" \
            "${auth_args[@]}" \
            -d "$payload" \
            || true
        )"
        post_http_code="${post_response##*$'\n'}"
        post_body="${post_response%$'\n'*}"

        if [ "$post_http_code" = "201" ]; then
          this_id="$(printf '%s' "$post_body" | jq -r '.id // empty' 2>/dev/null || true)"
          case "$this_id" in
            ''|*[!0-9]*)
              printf 'WARNING: Skynet maintenance for Note target %s returned malformed id; continuing deploy without releasable maintenance ID.\n' "$target_id" >&2
              ;;
            *)
              maintenance_ids="$maintenance_ids $this_id"
              printf 'Skynet maintenance %s confirmed for Note target %s.\n' "$this_id" "$target_id"
              ;;
          esac
        else
          printf 'WARNING: Skynet maintenance for Note target %s was not confirmed (HTTP %s); continuing deploy.\n' "$target_id" "${post_http_code:-curl-error}" >&2
        fi
      done

      cd "$DEPLOY_DIR"
      git fetch --prune "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "+refs/heads/${CI_COMMIT_BRANCH}:refs/remotes/origin/${CI_COMMIT_BRANCH}"
      git reset --hard "origin/${CI_COMMIT_BRANCH}"
      git log -1 --format='deployed commit = %h %s'
      ./scripts/deploy.sh

      for maintenance_id in $maintenance_ids; do
        delete_http_code="$(curl -sS --connect-timeout 3 --max-time 10 -o /dev/null -w "%{http_code}" -X DELETE "${SKYNET_MAINTENANCE_URL}/${maintenance_id}" "${auth_args[@]}" || true)"
        if [ "$delete_http_code" = "204" ]; then
          printf 'Skynet maintenance %s released.\n' "$maintenance_id"
        else
          printf 'WARNING: Failed to release Skynet maintenance %s (HTTP %s); deploy remains successful and TTL will expire it.\n' "$maintenance_id" "${delete_http_code:-curl-error}" >&2
        fi
      done
